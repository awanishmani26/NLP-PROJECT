<!DOCTYPE html>
<html>

<head>
    <title>Review Sentiment Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

<h1>🔍 Review Sentiment Predictor</h1>

<p class="description">
Enter a Kindle review below and the model will predict if it is positive or negative.
</p>

<form action="/predict" method="post">

<textarea name="review"
placeholder="Enter your review here..."
required></textarea>

<br>

<button type="submit" class="btn">Predict Sentiment</button>

</form>

{% if prediction_text %}

<div class="result">
    <h2>{{ prediction_text }}</h2>
</div>

{% endif %}

</div>

</body>

</html>
